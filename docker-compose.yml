services:
  api:  # nome tem que bater com o usado no nginx.conf ("api")
    build: .
    container_name: ponto-certo-api
    restart: unless-stopped
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - traefik  # mesma rede do front, sem labels de roteamento público

networks:
  traefik:
    external: true